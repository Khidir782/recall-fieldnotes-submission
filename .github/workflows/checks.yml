name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt -r ml/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run format:check
      - run: npm run build
      - run: npx wrangler pages functions build --outdir /tmp/recall-functions
      - run: npx wrangler deploy --dry-run --config workers/wrangler.local.jsonc --outdir /tmp/recall-retention
